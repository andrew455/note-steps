<style>
/* Layout: one column, staff card on top, feedback in the middle, on-screen keyboard at the bottom. */
:root {
  --paper: #f2f4f7;
  --card: #ffffff;
  --ink: #1b2233;
  --muted: #5d6679;
  --line: #c9cfdb;
  --accent: #2f62d8;
  --accent-soft: #e3ebfc;
  --good: #1f8a5b;
  --good-soft: #dcf3e8;
  --bad: #c8333d;
  --bad-soft: #fbe3e4;
  --key-white: #ffffff;
  --key-black: #1d212b;
  --key-heard: #cddbff;
  --key-hint: #c9efdb;
  --key-label: #5d6679;
  --gold: #b97a06;
  --on-accent: #ffffff;
  --on-gold: #1b1300;
  --learn: #a85f00;
  --learn-soft: #fbecd6;
  --listen: #b7791f;
  --listen-soft: #fff1cc;
  --key-playing: #ffe7a3;
  --shape: #7a8396;
  --song: #2f62d8;
  --yours: #c8333d;
  --match: #1f8a5b;
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Helvetica Neue", system-ui, sans-serif;
  --font-music: "Noto Music", "Bravura", "Apple Symbols", serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #12151c;
    --card: #1b2029;
    --ink: #e8ebf2;
    --muted: #9aa3b5;
    --line: #3a4252;
    --accent: #6e98ff;
    --accent-soft: #24304d;
    --good: #4cc98f;
    --good-soft: #1b3a2d;
    --bad: #ff6b74;
    --bad-soft: #43242a;
    --key-white: #e9ecf2;
    --key-black: #0b0d12;
    --gold: #f2b84b;
    --learn: #f2b04c;
    --learn-soft: #3d2f17;
    --listen: #f0b955;
    --listen-soft: #3d3220;
    --key-playing: #6b5420;
    --shape: #8d96a8;
    --song: #6e98ff;
    --yours: #ff6b74;
    --match: #4cc98f;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.5 var(--font-body);
  -webkit-tap-highlight-color: transparent;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.wrap {
  max-width: 760px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 28px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.01em; }
h2 { font-size: 1.35rem; font-weight: 800; }
p { margin: 0; }
.muted { color: var(--muted); }
.eyebrow { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }

button {
  font: inherit;
  color: inherit;
  border: 0;
  background: none;
  cursor: pointer;
}
button:focus-visible, .lesson:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 10px 16px; border-radius: 12px;
  font-weight: 700; background: var(--card); border: 1.5px solid var(--line);
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: 0.5; cursor: default; }

/* Home */
.hero { display: flex; flex-direction: column; gap: 8px; }
.hero-staff { width: 100%; max-width: 360px; height: auto; color: var(--ink); }
.level-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.levels { display: flex; flex-direction: column; gap: 26px; }
.level { display: flex; flex-direction: column; gap: 12px; }
.lessons { display: flex; flex-direction: column; gap: 10px; list-style: none; padding: 0; margin: 0; }
.lesson {
  width: 100%; text-align: left;
  display: grid; grid-template-columns: 40px 1fr; align-items: center; column-gap: 14px; row-gap: 10px;
  padding: 14px 16px; border-radius: 14px; background: var(--card); border: 1.5px solid var(--line);
}
.lesson .actions { grid-column: 2; display: flex; gap: 8px; flex-wrap: wrap; }
.lesson.locked { background: transparent; border-style: dashed; }
.lesson.locked .num { background: var(--line); color: var(--muted); }
.lesson.locked strong { color: var(--muted); }
.lesson .mode-line { display: block; font-size: 0.9rem; color: var(--muted); }
.stars-sm { color: var(--gold); letter-spacing: 0.05em; }
.btn.small { min-height: 40px; padding: 8px 16px; border-radius: 10px; }
.lesson .num {
  width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 800; background: var(--accent-soft); color: var(--accent);
}
.lesson.done .num { background: var(--good-soft); color: var(--good); }
.lesson .meta { min-width: 0; }
.lesson .meta strong { display: block; font-size: 1.05rem; }
.lesson .meta .sub { display: block; font-size: 0.9rem; color: var(--muted); }
.tip { background: var(--card); border-radius: 14px; padding: 14px 16px; border: 1.5px dashed var(--line); font-size: 0.95rem; }
.qr { display: flex; gap: 16px; align-items: center; background: var(--card); border-radius: 14px; padding: 14px 16px; border: 1.5px solid var(--line); }
.qr-code { background: #fff; padding: 8px; border-radius: 8px; flex: none; }
.qr-code img, .qr-code canvas { display: block; width: 120px; height: 120px; }
.qr .meta { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.qr .url { font-size: 0.85rem; color: var(--muted); word-break: break-all; }

/* Play screen */
.topbar { display: flex; align-items: center; gap: 12px; }
.topbar .title { flex: 1; min-width: 0; }
.topbar .title h2 { font-size: 1.15rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.back { width: 44px; height: 44px; border-radius: 12px; background: var(--card); border: 1.5px solid var(--line); font-size: 1.3rem; flex: none; }
.progress { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.progress > div { height: 100%; background: var(--good); width: 0; transition: width 0.25s ease; }
.count { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.9rem; flex: none; }

.staff-card { background: var(--card); border-radius: 16px; border: 1.5px solid var(--line); padding: 8px 4px; }
.staff-card svg { display: block; width: 100%; height: auto; }
.staff-card .page-note { text-align: center; font-size: 0.8rem; color: var(--muted); padding-bottom: 4px; }

.feedback {
  min-height: 84px; border-radius: 14px; padding: 14px 16px;
  display: flex; flex-direction: column; justify-content: center; gap: 2px;
  background: var(--accent-soft);
  transition: background 0.2s ease;
}
.feedback .big { font-family: var(--font-display); font-weight: 800; font-size: 1.45rem; }
.feedback.good { background: var(--good-soft); }
.feedback.good .big { color: var(--good); }
.feedback.bad { background: var(--bad-soft); }
.feedback.bad .big { color: var(--bad); }

.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.meter { flex: 1 1 120px; display: flex; align-items: center; gap: 8px; min-width: 120px; font-size: 0.85rem; color: var(--muted); }
.meter .bar { flex: 1; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.meter .bar > div { height: 100%; width: 0; background: var(--accent); transition: width 0.06s linear; }

.keyboard { position: relative; height: 150px; user-select: none; touch-action: manipulation; }
.keyboard .white, .keyboard .black { position: absolute; top: 0; border-radius: 0 0 8px 8px; display: flex; align-items: flex-end; justify-content: center; font-size: 0.8rem; font-weight: 700; padding-bottom: 8px; }
.keyboard .white { height: 100%; background: var(--key-white); border: 1.5px solid var(--line); color: var(--key-label); }
.keyboard .black { height: 60%; background: var(--key-black); z-index: 2; color: transparent; }
.keyboard .white.heard { background: var(--key-heard); box-shadow: inset 0 -6px 0 var(--accent); color: var(--key-label); }
.keyboard .black.heard { background: var(--accent); }
.keyboard .white.hint { background: var(--key-hint); box-shadow: inset 0 -6px 0 var(--good); }
.keyboard .black.hint { background: var(--good); }
.keyboard .middle-c::after { content: "middle"; position: absolute; bottom: 28px; font-size: 0.62rem; font-weight: 400; color: var(--key-label); letter-spacing: 0.02em; }

.notice { font-size: 0.9rem; color: var(--bad); }

/* Done overlay */
.overlay { position: fixed; inset: 0; background: rgba(10, 14, 22, 0.55); display: grid; place-items: safe center; padding: 16px; z-index: 10; overflow-y: auto; }
.dialog { background: var(--card); border-radius: 20px; padding: 24px; max-width: 420px; width: 100%; margin: auto; display: flex; flex-direction: column; gap: 14px; text-align: center; }
.dialog .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.stars { font-size: 2.2rem; letter-spacing: 0.1em; color: var(--gold); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
