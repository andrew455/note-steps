<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chord Card Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Music&display=swap">
<style>
/* Tokens copied from index.html. The data-theme attribute only exists here, to flip themes for eyeballing. */
:root {
  --paper: #f2f4f7;
  --card: #ffffff;
  --ink: #1b2233;
  --muted: #5d6679;
  --line: #c9cfdb;
  --accent: #2f62d8;
  --accent-soft: #e3ebfc;
  --good: #1f8a5b;
  --good-soft: #dcf3e8;
  --bad: #c8333d;
  --bad-soft: #fbe3e4;
  --key-white: #ffffff;
  --key-black: #1d212b;
  --key-heard: #cddbff;
  --key-hint: #c9efdb;
  --key-label: #5d6679;
  --gold: #b97a06;
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Helvetica Neue", system-ui, sans-serif;
  --font-music: "Noto Music", "Bravura", "Apple Symbols", serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12151c;
    --card: #1b2029;
    --ink: #e8ebf2;
    --muted: #9aa3b5;
    --line: #3a4252;
    --accent: #6e98ff;
    --accent-soft: #24304d;
    --good: #4cc98f;
    --good-soft: #1b3a2d;
    --bad: #ff6b74;
    --bad-soft: #43242a;
    --key-white: #e9ecf2;
    --key-black: #0b0d12;
    --gold: #f2b84b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12151c;
  --card: #1b2029;
  --ink: #e8ebf2;
  --muted: #9aa3b5;
  --line: #3a4252;
  --accent: #6e98ff;
  --accent-soft: #24304d;
  --good: #4cc98f;
  --good-soft: #1b3a2d;
  --bad: #ff6b74;
  --bad-soft: #43242a;
  --key-white: #e9ecf2;
  --key-black: #0b0d12;
  --gold: #f2b84b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 var(--font-body); }
h2 { font-family: var(--font-display); font-size: 1.35rem; font-weight: 800; margin: 0; line-height: 1.15; }
p { margin: 0; }
.muted { color: var(--muted); }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 10px 16px; border-radius: 12px;
  font-weight: 700; background: var(--card); border: 1.5px solid var(--line);
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

/* Demo controls */
.tools { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 16px; background: var(--card); border-bottom: 1.5px solid var(--line); }
.tools .btn { min-height: 36px; padding: 6px 12px; font-size: 0.9rem; }
.tools .log { flex-basis: 100%; font-size: 0.85rem; color: var(--muted); }
.stage { display: grid; place-items: center; padding: 16px; }
.stage.phone > .dialog { max-width: 343px; }

/* Done popup, as in index.html (rendered in place instead of as a fixed overlay) */
.dialog { background: var(--card); border-radius: 20px; padding: 24px; max-width: 420px; width: 100%; display: flex; flex-direction: column; gap: 14px; text-align: center; box-shadow: 0 10px 40px rgba(10, 14, 22, 0.25); }
.dialog .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.stars { font-size: 2.2rem; letter-spacing: 0.1em; color: var(--gold); }
</style>
</head>
<body>
<div class="tools">
  <button class="btn" id="themeBtn">Theme: system</button>
  <button class="btn on" id="phoneBtn" aria-pressed="true">Width: 375px phone</button>
  <button class="btn" id="listenFake">listening: false</button>
  <button class="btn" id="flashC">flash('C')</button>
  <button class="btn" id="flashCm">flash('Cm')</button>
  <button class="btn" id="lastBtn">Last lesson (C minor only)</button>
  <button class="btn primary" id="micBtn">🎤 Use the real mic</button>
  <p class="log" id="log">Mock of the lesson-complete popup. The mic button runs chords.js for real (needs https or localhost).</p>
</div>

<div class="stage phone" id="stage">
  <div class="dialog" role="dialog" aria-labelledby="doneTitle">
    <div class="stars">★★★</div>
    <h2 id="doneTitle">Perfect!</h2>
    <p class="muted">You played all 8 notes of C major scale, going up without a single mistake.</p>
    <div class="row">
      <button class="btn" id="againBtn">Play again</button>
      <button class="btn primary" id="nextBtn">Next lesson</button>
    </div>
    <button class="btn" id="listBtn">All lessons</button>
    <div id="chordSlot"></div>
  </div>
</div>

<script src="../chord-card.js"></script>
<script src="../chords.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const log = (t) => { $('log').textContent = t; };
  const BOTH = [
    { id: 'C', title: 'C major', action: 'Next lesson', notes: ['C4', 'E4', 'G4'], fingers: [1, 3, 5] },
    { id: 'Cm', title: 'C minor', action: 'Play again', notes: ['C4', 'Eb4', 'G4'], fingers: [1, 3, 5] },
  ];
  let listening = false;
  let onlyMinor = false;
  let card = null;
  function mount() {
    if (card) card.destroy();
    card = ChordCard.render($('chordSlot'), { chords: onlyMinor ? BOTH.slice(1) : BOTH, listening });
    $('nextBtn').hidden = onlyMinor;
  }
  mount();

  const themes = ['system', 'light', 'dark'];
  let ti = 0;
  $('themeBtn').addEventListener('click', () => {
    ti = (ti + 1) % themes.length;
    if (themes[ti] === 'system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', themes[ti]);
    $('themeBtn').textContent = 'Theme: ' + themes[ti];
  });
  $('phoneBtn').addEventListener('click', () => {
    const on = $('stage').classList.toggle('phone');
    $('phoneBtn').classList.toggle('on', on);
    $('phoneBtn').setAttribute('aria-pressed', String(on));
    $('phoneBtn').textContent = on ? 'Width: 375px phone' : 'Width: full';
  });
  $('listenFake').addEventListener('click', () => {
    listening = !listening;
    card.setListening(listening);
    $('listenFake').textContent = 'listening: ' + listening;
  });
  $('flashC').addEventListener('click', () => card.flash('C'));
  $('flashCm').addEventListener('click', () => card.flash('Cm'));
  $('lastBtn').addEventListener('click', () => {
    onlyMinor = !onlyMinor;
    $('lastBtn').classList.toggle('on', onlyMinor);
    mount();
  });
  ['againBtn', 'nextBtn', 'listBtn'].forEach((id) => $(id).addEventListener('click', () => log('Button: ' + $(id).textContent)));

  let mic = null;
  $('micBtn').addEventListener('click', async () => {
    if (mic) {
      mic.chords.dispose();
      mic.stream.getTracks().forEach((t) => t.stop());
      mic.ctx.close();
      mic = null;
      listening = false;
      card.setListening(false);
      $('micBtn').textContent = '🎤 Use the real mic';
      return;
    }
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
      });
      const src = ctx.createMediaStreamSource(stream);
      const chords = ChordDetect.attach(ctx, src, {
        onChord: (name) => {
          card.flash(name);
          log('Heard ' + name + ' at ' + new Date().toLocaleTimeString());
        },
      });
      chords.start();
      mic = { ctx, stream, chords };
      listening = true;
      card.setListening(true);
      $('micBtn').textContent = '■ Stop the mic';
    } catch (err) {
      log('Mic failed: ' + (err && err.message ? err.message : err));
    }
  });
})();
</script>
</body>
</html>
